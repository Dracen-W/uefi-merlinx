#
# UEFI FD Configs
#
[uefi_fd]
base = 0x40080000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = false

#
# Android Boot Image Configs
#
[boot_image]
base           = 0x40078000
cmdline        = "bootopt=64S3,32N2,64N2 androidboot.serialconsole=0"
dtb            = "Resources/DTBs/merlinx.dtb"
dtb_offset     = 0x0BC08000
header_version = 2
kernel_offset  = 0x00008000
pagesize       = 2048
ramdisk_offset = 0x07C08000
second_offset  = 0xBFF88000
tags_offset    = 0x0BC08000
